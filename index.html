function renderSchedule(){
  const s=state.schedules[month]||{},allDates=dates(month),mobile=Boolean(window.matchMedia&&window.matchMedia("(max-width:760px)").matches),maxWeek=Math.ceil(allDates.length/7)-1;scheduleWeek=Math.max(0,Math.min(scheduleWeek,maxWeek));const shownDates=mobile?allDates.slice(scheduleWeek*7,scheduleWeek*7+7):allDates,people=state.staff.filter(active),counts=countsFor(s),rangeLabel=Number(shownDates[0].slice(-2))+"日〜"+Number(shownDates[shownDates.length-1].slice(-2))+"日";
  let html='<div class="lead"><div><h2>'+esc(month.replace("-","年"))+'月 確認・入れ替え</h2><p class="ruleNote">縦が夜勤者、横が日付です。セルから店舗を直接変更できます。</p><div class="legend"><span class="k">春日夜</span><span class="t">大成夜</span><span class="h">花園夜</span><span class="u">希望休</span><span class="n">出勤不可</span></div></div><button class="primary" id="auto">条件から自動割当</button></div><div class="matrixPager"><button id="prevWeek" '+(scheduleWeek===0?'disabled':'')+'>‹ 前週</button><b>'+rangeLabel+'</b><button id="nextWeek" '+(scheduleWeek===maxWeek?'disabled':'')+'>次週 ›</button></div><div class="matrixWrap"><div class="shiftMatrix" style="--cols:'+shownDates.length+'"><div class="matrixCorner">夜勤者／日付</div>';
  shownDates.forEach(date=>{const w=weekday(date),noNightStores=STORES.filter(store=>s[date]&&s[date][store]===NO_NIGHT);html+='<div class="matrixDate '+(w===0?'sun':w===6?'sat':'')+'"><b>'+Number(date.slice(-2))+DAYS[w]+'</b>'+(noNightStores.length?'<small>'+noNightStores.map(store=>store.slice(0,1)).join("・")+'無</small>':'')+'</div>'});

function toggleArray(person,field,value){const a=person[field];person[field]=a.includes(value)?a.filter(x=>x!==value):[...a,value];markDirty();renderStaff()}
function updatePerson(id,field,value){const p=state.staff.find(x=>x.id===id);if(!p)return;p[field]=value;markDirty()}
function monthDays(person,field){return list(person,field).filter(d=>d.slice(0,7)===month).map(d=>Number(d.slice(-2))).sort((a,b)=>a-b).join(",")}
function parseMonthDays(text){
  const monthNumber=Number(month.slice(5,7)),yearNumber=Number(month.slice(0,4));let value=String(text||"").replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65248)).replace(/[～〜―ー−]/g,"-");
  value=value.replace(/(\d{4})[\/\.](\d{1,2})[\/\.](\d{1,2})/g,(_,y,m,d)=>Number(y)===yearNumber&&Number(m)===monthNumber?d:" ");

  const result=[];for(const match of value.matchAll(/(\d{1,2})(?:\s*-\s*(\d{1,2}))?/g)){const start=Number(match[1]),end=match[2]?Number(match[2]):start;if(start<1||start>daysInMonth(month)||end<1||end>daysInMonth(month))continue;const step=start<=end?1:-1;for(let n=start;;n+=step){result.push(n);if(n===end)break}}

}

  html+='<div class="conditionTools"><div class="conditionFilters">'+['all',...STORES].map(s=>'<button type="button" class="storeFilter '+(staffStoreFilter===s?'active':'')+'" data-store-filter="'+s+'">'+(s==='all'?'すべて':s)+'</button>').join('')+'</div><input class="conditionSearch" id="staffSearch" placeholder="氏名・備考を検索" aria-label="夜勤者を検索"></div>';
  html+='<section class="directCards">';
  state.staff.forEach(p=>{const mode=dateMode(p),bulkField=mode==="available"?"availableDates":"blockedDates",bulkLabel=mode==="available"?"出勤可能日":"希望休",accent=storeClass(p.homeStore),search=(p.name+' '+p.notes+' '+p.homeStore).toLowerCase();
    html+='<article class="directCard '+accent+' '+(p.active?'':'off')+'" data-condition-row data-search="'+esc(search)+'" data-store="'+esc(p.homeStore)+'"><div class="directHead"><input class="directName" aria-label="氏名" data-id="'+p.id+'" data-field="name" value="'+esc(p.name)+'"><label class="directActive"><input type="checkbox" aria-label="割当対象" data-id="'+p.id+'" data-field="active" '+(p.active?'checked':'')+'>割当対象</label></div><div class="directBody">';
    html+='<div class="directGrid"><label class="directField"><span>所属店舗</span><select data-id="'+p.id+'" data-field="homeStore"><option value="">未設定</option>'+STORES.map(s=>'<option '+(p.homeStore===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="directField"><span>最低回数</span><input type="number" min="0" data-id="'+p.id+'" data-field="min" value="'+p.min+'"></label><label class="directField"><span>最大回数</span><input type="number" min="0" data-id="'+p.id+'" data-field="max" value="'+p.max+'"></label></div>';
    html+='<div class="directSection"><span class="directLabel">出勤できる曜日</span><div class="weekdayButtons">'+DAYS.map((d,i)=>'<button type="button" class="'+(p.allowedWeekdays.includes(i)?'on':'')+'" data-weekday="'+i+'" data-person="'+p.id+'">'+d+'</button>').join('')+'</div></div>';
    html+='<div class="directSection"><span class="directLabel">他店舗へのヘルプ</span><div class="helpChecks">'+STORES.map(s=>'<label><input type="checkbox" data-help="'+s+'" data-person="'+p.id+'" '+(p.helpStores.includes(s)?'checked':'')+'>'+s+'</label>').join('')+'</div></div>';
    html+='<div class="directDates"><label class="directField"><span>日付の入力方式</span><select data-date-mode="'+p.id+'"><option value="blocked" '+(mode==="blocked"?'selected':'')+'>希望休</option><option value="available" '+(mode==="available"?'selected':'')+'>出勤可能日</option></select></label><label class="directField"><span>'+bulkLabel+'（例：1,3,5／10〜20）</span><input class="bulkInput '+(mode==="blocked"?'wishInput':'')+'" data-month-field="'+bulkField+'" data-person="'+p.id+'" value="'+esc(monthDays(p,bulkField))+'"></label></div>';
    if(mode==="blocked")html+='<label class="directField directExtra"><span>曜日条件外でも入れる日</span><input class="extraInput" data-month-field="extraDates" data-person="'+p.id+'" placeholder="例：7,14" value="'+esc(monthDays(p,"extraDates"))+'"></label>';
    html+='<div class="directFooter"><label class="directField"><span>備考</span><input data-id="'+p.id+'" data-field="notes" value="'+esc(p.notes)+'"></label><button type="button" class="delete" data-delete="'+p.id+'">削除</button></div></div></article>';
  });
  if(!state.staff.length)html+='<div class="directEmpty">夜勤者がまだ登録されていません。</div>';
  html+='</section>';
  app.innerHTML=html;
  document.querySelector("#add").onclick=()=>{const person={id:"staff-"+Date.now(),name:"新しい夜勤者",homeStore:"",min:0,max:0,notes:"",active:true,allowedWeekdays:[0,1,2,3,4,5,6],helpStores:[...STORES],extraDates:[],blockedDates:[],availableDates:[],availableOnlyMonths:[]};state.staff.push(person);markDirty();renderStaff();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
  document.querySelectorAll("[data-store-filter]").forEach(el=>el.onclick=e=>{staffStoreFilter=e.currentTarget.dataset.storeFilter;renderStaff()});
  const search=document.querySelector("#staffSearch");if(search){search.value=staffSearchQuery;search.oninput=e=>{staffSearchQuery=e.target.value.trim().toLowerCase();document.querySelectorAll("[data-condition-row]").forEach(row=>{const storeOk=staffStoreFilter==='all'||row.dataset.store===staffStoreFilter;row.hidden=!storeOk||!row.dataset.search.includes(staffSearchQuery)})}};
  document.querySelectorAll("[data-condition-row]").forEach(row=>{const storeOk=staffStoreFilter==='all'||row.dataset.store===staffStoreFilter;row.hidden=!storeOk||!row.dataset.search.includes(staffSearchQuery)});
  document.querySelectorAll("[data-id]").forEach(el=>el.onchange=e=>{const f=e.target.dataset.field;let v=e.target.type==="checkbox"?e.target.checked:e.target.value;if(f==="min"||f==="max")v=Number(v);updatePerson(e.target.dataset.id,f,v);if(f==="active"||f==="homeStore")renderStaff()});
  document.querySelectorAll("[data-weekday]").forEach(el=>el.onclick=e=>{const p=state.staff.find(x=>x.id===e.target.dataset.person);toggleArray(p,"allowedWeekdays",Number(e.target.dataset.weekday))});
  document.querySelectorAll("[data-help]").forEach(el=>el.onchange=e=>{const p=state.staff.find(x=>x.id===e.target.dataset.person);toggleArray(p,"helpStores",e.target.dataset.help)});
  document.querySelectorAll("[data-date-mode]").forEach(el=>el.onchange=e=>setDateMode(e.target.dataset.dateMode,e.target.value));
  document.querySelectorAll("[data-month-field]").forEach(el=>el.onchange=e=>updateMonthDays(e.target.dataset.person,e.target.dataset.monthField,e.target.value));
  document.querySelectorAll("[data-delete]").forEach(el=>el.onclick=e=>deletePerson(e.target.dataset.delete));
}
function render(){if(!state)return;document.body.classList.toggle("staffMode",tab==="staff");document.body.classList.toggle("scheduleMode",tab==="schedule");app.classList.toggle("wide",tab==="schedule");if(tab==="dashboard")renderDashboard();else if(tab==="schedule")renderSchedule();else renderStaff()}
function switchTab(next){tab=next;if(next!=="staff")mobileStaffDetailOpen=false;document.body.classList.toggle("staffDetailOpen",next==="staff"&&mobileStaffDetailOpen);document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
monthInput.onchange=e=>{month=e.target.value;scheduleWeek=0;render()};
loginEl.onclick=async()=>{if(canEdit&&supabaseClient){await supabaseClient.auth.signOut();return}authError.textContent="";authDialog.showModal()};
document.querySelector("#authCancel").onclick=()=>{if(!authDialog.classList.contains("required"))authDialog.close()};
exportEl.onclick=()=>{const blob=new Blob([JSON.stringify({state,updatedAt:new Date().toISOString()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="night-shift-coverage-data-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
importEl.onclick=()=>{if(!canEdit){authError.textContent="データ読込には編集ログインが必要です。";authDialog.showModal();return}importFile.click()};
importFile.onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),next=parsed.state||parsed;if(next.version!==1||!Array.isArray(next.staff)||!next.schedules)throw 0;state=next;cacheState();render();await save();showSyncNotice("")}catch(err){alert("夜勤表のバックアップファイルを確認してください。") }finally{e.target.value=""}};
authForm.onsubmit=async e=>{e.preventDefault();if(!supabaseClient){authError.textContent="初期設定中です。しばらくお待ちください。";return}authError.textContent="ログイン中…";const {error}=await supabaseClient.auth.signInWithPassword({email:authEmail.value.trim(),password:authPassword.value});if(error){authError.textContent="メールアドレスまたはパスワードを確認してください。";return}authPassword.value="";try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");state=cached?.state||clone(INITIAL_STATE)}catch(err){state=clone(INITIAL_STATE)}unlockForSession();render();try{await loadRemote();showSyncNotice("")}catch(err){showSyncNotice("最新データを取得できませんでした。ネット接続を確認してください。")}startRealtime()};
async function applyRemoteState(next){if(!next||next.version!==1||!Array.isArray(next.staff))return;state=next;cacheState();saveEl.textContent="同期済み";saveEl.className="save";render()}
async function loadRemote(){const {data,error}=await supabaseClient.from("night_shift_state").select("state,updated_at").eq("id",1).maybeSingle();if(error)throw error;if(data?.state)await applyRemoteState(data.state)}
function startRealtime(){if(realtimeChannel) return;realtimeChannel=supabaseClient.channel("night-shift-sync").on("postgres_changes",{event:"*",schema:"public",table:"night_shift_state",filter:"id=eq.1"},payload=>{const next=payload.new&&payload.new.state;if(next)applyRemoteState(next)}).subscribe()}
(async()=>{
  const now=new Date();month=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");monthInput.value=month;state=clone(INITIAL_STATE);document.body.classList.add("readonly","locked");
  const configured=Boolean(config.supabaseUrl&&config.supabaseAnonKey);
  if(!configured){saveEl.textContent="設定待ち";authSubmit.textContent="設定待ち";requireLogin("初期設定中です。しばらくお待ちください。");return}
  try{await supabaseSdkReady}catch(e){saveEl.textContent="接続エラー";authSubmit.textContent="再読み込みしてください";requireLogin("接続部品を読み込めませんでした。ページを再読み込みしてください。");return}
  supabaseClient=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  authSubmit.disabled=false;authSubmit.textContent="ログイン";authError.textContent="";
  const {data:{session}}=await supabaseClient.auth.getSession();
  supabaseClient.auth.onAuthStateChange((_event,nextSession)=>{if(!nextSession)requireLogin("")});
  if(!session){requireLogin("");return}
  try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");state=cached?.state||clone(INITIAL_STATE)}catch(e){state=clone(INITIAL_STATE)}
  unlockForSession();saveEl.textContent="前回データ";render();
  try{await loadRemote();showSyncNotice("")}catch(e){saveEl.textContent="前回データ";saveEl.className="save error";showSyncNotice("最新データを取得できないため、前回データを表示しています。")}
  startRealtime();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js?v=5",{updateViaCache:"none"}).then(registration=>registration.update()).catch(()=>{});
})();
</script>
